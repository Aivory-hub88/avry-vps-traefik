http:
  middlewares:
    aivory-secure:
      chain:
        middlewares:
          - "crowdsec-bouncer"
          - "aivory-headers"
          - "aivory-ratelimit"

    aivory-headers:
      headers:
        # Remove server identification
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
        # HSTS — force HTTPS for 1 year + subdomains
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        # Prevent clickjacking
        frameDeny: true
        # Prevent MIME sniffing
        contentTypeNosniff: true
        # XSS protection
        browserXssFilter: true
        # Referrer policy
        referrerPolicy: "strict-origin-when-cross-origin"
        # Content Security Policy
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://challenges.cloudflare.com https://app.midtrans.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://static.cloudflareinsights.com https://www.googleadservices.com https://googleads.g.doubleclick.net; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://app.midtrans.com https://api.midtrans.com https://td.doubleclick.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com https://app.midtrans.com https://api.midtrans.com https://aivory.uk https://api.aivory.uk https://*.aivory.uk wss://*.aivory.uk wss://*.livekit.cloud https://*.livekit.cloud https://aivory.id https://*.aivory.id https://fonts.gstatic.com https://formsubmit.co https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://ad.doubleclick.net https://googleads.g.doubleclick.net https://www.googleadservices.com; frame-ancestors 'self'"
        # Permissions Policy — restrict browser features
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    aivory-ratelimit:
      rateLimit:
        average: 120
        burst: 300
        period: 1s

    # Global concurrency cap for expensive LLM routes
    llm-inflight:
      inFlightReq:
        amount: 30
        sourceCriterion:
          requestHost: true